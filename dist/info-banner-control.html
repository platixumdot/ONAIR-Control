<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#111827;color:#eef4ff;font:14px Arial;padding:28px;max-width:580px}h1{margin:0 0 8px}p{color:#aebcd1;line-height:1.45}label{display:block;margin:18px 0 6px;color:#b9c9e4}input{width:100%;box-sizing:border-box;background:#0a1221;border:1px solid #3a527a;border-radius:6px;color:#fff;padding:11px;font:14px Arial}button{margin:18px 8px 0 0;background:#1677ff;border:0;border-radius:6px;color:white;padding:11px 16px;font-weight:700;cursor:pointer}button.secondary{background:#263650}small{display:block;margin-top:18px;color:#8395b3}</style></head><body><h1>Info Banner</h1><p>Der Inhalt wird sofort in der OBS Browser Source angezeigt.</p><label>Überschrift</label><input id="headline" placeholder="Zum Beispiel: Kurze technische Pause"><label>Zusatztext</label><input id="detail" placeholder="Wir sind gleich zurück."><button onclick="save(true)">Banner einblenden</button><button class="secondary" onclick="save(false)">Banner ausblenden</button><small>OBS Browser Source URL: <b>http://localhost:5173/overlay-info-banner.html</b></small><script>async function save(visible){await fetch('http://localhost:3010/api/banner',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visible,headline:headline.value,detail:detail.value})})}</script></body></html>

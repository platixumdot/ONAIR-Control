<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif}.banner{position:fixed;left:0;right:0;bottom:8%;display:flex;justify-content:center;pointer-events:none}.card{min-width:720px;max-width:1180px;display:grid;grid-template-columns:10px 1fr auto;align-items:stretch;background:#061a36;border:1px solid rgba(126,183,255,.55);box-shadow:0 18px 55px rgba(0,8,25,.45);color:#fff;opacity:0;transform:translateY(90px)}.on .card{animation:in .55s cubic-bezier(.16,1,.3,1) forwards}.off .card{animation:out .48s cubic-bezier(.55,0,1,.45) forwards}.accent{background:#1677ff}.copy{padding:19px 30px}.label{display:block;margin-bottom:5px;font:600 10px monospace;letter-spacing:2px;color:#80b5ff}.headline{font-size:26px;font-weight:800;letter-spacing:-.4px}.detail{margin-top:6px;font:13px monospace;letter-spacing:.45px;color:#d1e4ff}.mark{padding:0 26px;display:grid;place-items:center;font:700 11px monospace;letter-spacing:1.5px;color:#8dbcff;border-left:1px solid rgba(126,183,255,.25)}@keyframes in{to{opacity:1;transform:none}}@keyframes out{to{opacity:0;transform:translateY(90px)}}
</style></head><body><div id="banner" class="banner off"><div class="card"><div class="accent"></div><div class="copy"><span class="label">INFORMATION</span><div class="headline"></div><div class="detail"></div></div><div class="mark">ONAIR</div></div></div><script>let last=false;async function update(){try{let b=await fetch('http://localhost:3010/api/banner').then(r=>r.json()),el=document.getElementById('banner');document.querySelector('.headline').textContent=b.headline;document.querySelector('.detail').textContent=b.detail;if(b.visible!==last){el.className='banner '+(b.visible?'on':'off');last=b.visible}}catch{}}update();setInterval(update,450)</script></body></html>

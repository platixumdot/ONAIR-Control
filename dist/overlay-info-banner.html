<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;width:100%;height:100%;
    background:transparent;overflow:hidden;
    font-family:"Manrope","Inter",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .banner{
    position:fixed;left:0;right:0;bottom:9%;
    display:flex;justify-content:center;
    pointer-events:none;
    padding:0 4vw;
  }

  /* ---------- card ---------- */
  .card{
    position:relative;
    width:min(1240px,93vw);
    display:grid;
    grid-template-columns:6px minmax(0,1fr) auto;
    align-items:stretch;
    color:#ebebed;
    background:linear-gradient(180deg, rgba(24,26,30,.94) 0%, rgba(14,15,17,.96) 100%);
    border:1px solid rgba(255,255,255,.08);
    border-radius:6px;
    overflow:hidden;
    box-shadow:
      0 30px 80px rgba(0,0,0,.55),
      0 1px 0 rgba(255,255,255,.05) inset;
    -webkit-backdrop-filter: blur(20px) saturate(120%);
    backdrop-filter: blur(20px) saturate(120%);
    opacity:0;
    transform:translateY(70px);
  }
  .card:before{
    content:"";
    position:absolute;inset:0;
    background:radial-gradient(120% 160% at 10% 0%, rgba(255,255,255,.05), transparent 60%);
    pointer-events:none;
  }

  .on  .card{ animation: in  .6s cubic-bezier(.16,1,.3,1) forwards; }
  .off .card{ animation: out .45s cubic-bezier(.55,0,1,.45) forwards; }

  /* ---------- left accent edge ---------- */
  .accent{
    position:relative;
    background:#e8e5de;
  }
  .accent:before{
    content:"";
    position:absolute;top:0;left:0;right:0;
    height:32px;
    background:rgba(255,255,255,.55);
  }
  .accent:after{
    content:"";
    position:absolute;left:0;right:0;bottom:0;
    height:44%;
    background:rgba(0,0,0,.18);
  }

  /* ---------- copy ---------- */
  .copy{
    padding:30px 40px 32px 34px;
    min-width:0;
    position:relative;
    z-index:1;
  }

  .kicker{
    display:inline-flex;
    align-items:center;
    gap:11px;
    margin-bottom:12px;
    font:600 13px/1 "DM Mono",ui-monospace,Menlo,Consolas,monospace;
    letter-spacing:3.6px;
    text-transform:uppercase;
    color:#e8e5de;
  }
  .kicker .dot{
    width:7px;height:7px;
    border-radius:50%;
    background:#e8e5de;
    box-shadow:0 0 0 0 rgba(232,229,222,.5);
    animation:kicker-pulse 2.4s ease-in-out infinite;
  }

  .headline{
    font-size:50px;
    line-height:1.04;
    font-weight:800;
    letter-spacing:-1.2px;
    color:#ffffff;
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .divider{
    width:64px;height:2px;
    margin:16px 0 14px;
    background:linear-gradient(90deg,#e8e5de, rgba(232,229,222,0));
    border-radius:2px;
  }

  .detail{
    font:500 21px/1.4 "DM Mono",ui-monospace,Menlo,Consolas,monospace;
    letter-spacing:.2px;
    color:#b8b6b1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* ---------- right ONAIR mark ---------- */
  .mark{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:11px;
    padding:0 36px;
    background:rgba(255,255,255,.02);
    border-left:1px solid rgba(255,255,255,.08);
    position:relative;
  }
  .mark .pulse{
    width:10px;height:10px;
    border-radius:50%;
    background:#e5484d;
    box-shadow:0 0 0 0 rgba(229,72,77,.6);
    animation:pulse 2s ease-in-out infinite;
  }
  .mark .txt{
    font:700 14px/1 "DM Mono",ui-monospace,Menlo,Consolas,monospace;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#e8e5de;
  }

  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(229,72,77,.55); }
    50%    { box-shadow:0 0 0 8px rgba(229,72,77,0); }
  }
  @keyframes kicker-pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(232,229,222,.45); }
    50%    { box-shadow:0 0 0 6px rgba(232,229,222,0); }
  }

  @keyframes in{
    0%  { opacity:0; transform:translateY(70px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  @keyframes out{
    0%  { opacity:1; transform:translateY(0); }
    100%{ opacity:0; transform:translateY(60px); }
  }

  @media(max-width:900px){
    .headline{font-size:34px}
    .detail{font-size:15px}
    .copy{padding:22px 24px 24px}
    .mark{padding:0 18px}
    .mark .txt{font-size:11px;letter-spacing:2px}
  }
</style>
</head>
<body>
  <div id="banner" class="banner off">
    <div class="card">
      <div class="accent"></div>

      <div class="copy">
        <div class="kicker">
          <span class="dot"></span>
          <span>Information</span>
        </div>
        <div class="headline"></div>
        <div class="divider"></div>
        <div class="detail"></div>
      </div>

      <div class="mark">
        <span class="pulse"></span>
        <span class="txt">On Air</span>
      </div>
    </div>
  </div>

  <script>
    let last = false;
    async function update(){
      try{
        const b  = await fetch('http://localhost:3010/api/banner').then(r=>r.json());
        const el = document.getElementById('banner');
        document.querySelector('.headline').textContent = b.headline;
        document.querySelector('.detail').textContent   = b.detail;
        if(b.visible !== last){
          el.className = 'banner ' + (b.visible ? 'on' : 'off');
          last = b.visible;
        }
      }catch(e){}
    }
    update();
    setInterval(update, 450);
  </script>
</body>
</html>
